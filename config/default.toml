# Default configuration of the simulation.
#
# All parameters are read from this file: there are no hard-coded values in the
# code. For a different experiment, copy the file and pass the copy with
# --config.
#
# Relative paths are resolved against the directory the program is launched
# from (the project root).

[lattice]
width = 20
height = 20

[protein]
length = 16                     # N: must match the length of `sequence`
sequence = "HPHPPHHPHPPHPHHH"   # example sequence (H = hydrophobic, P = polar)
# Initial configuration drawn with the GUI (phase 0).
initial_conformation = "data/input/initial_conformation.json"

[gui]
# Appearance of the drawing window (phase 0).
# The grid of the window is a square of protein.length + 4 nodes per side, the
# lattice on which the dataset (phase 2) places every state; it does not use
# [lattice], which must be at least that large.
# Sizes when the window opens: resizing the window rescales the grid and the
# residues, keeping the same proportion between the two.
cell_size = 60              # distance in pixels between two adjacent nodes of the grid
residue_radius = 16         # radius in pixels of the circle drawn for a residue
color_untyped = "#667085"   # residue whose type has not been assigned yet
color_h = "#E53935"         # hydrophobic residue
color_p = "#1E88E5"         # polar residue
# Animation of the path to the native state (phase `discriminator_score`).
animation_move_ms = 600     # time for the residues to slide through one move
animation_pause_ms = 700    # stop on every conformation of the path

[remc]
# Replica Exchange Monte Carlo (phase 1), variant REMC_m of Thachuk et al.
# (2007). Values of the paper for the 2D case; the temperatures are the ones
# of the paper divided by 1000.
n_replicas = 5      # M: number of replicas
t_min = 0.160        # T_1: temperature of the coldest replica (k_B = 1)
t_max = 0.220        # T_M: temperature of the hottest replica
local_steps = 500   # phi: local Monte Carlo steps between two swap attempts
n_cycles = 10000     # number of cycles (local sampling + swap)
rho = 0.4           # probability that a local step uses a pull move (otherwise VSHD)
save_every = 10     # how many cycles between saves of the intermediate configurations
seed = 42           # seed of the random number generator

[exact]
# Check of the REMC result, run on request with the `verify` phase: the true
# minimum energy is computed by enumerating all the conformations of the
# sequence. The cost grows exponentially with the length, so longer chains are
# not checked.
max_length = 25     # longest chain verified by exact enumeration

[output]
# Lowest-energy conformation found by the REMC (phase 1).
native_conformation = "data/output/native_conformation.json"
samples_dir = "data/output/samples"   # intermediate configurations written by the C++ code
# Labelled dataset for the folding policy (phase `policy_dataset`).
policy_dataset_dir = "data/output/datasets/policy_dataset"
# Natives and decoys for the decoy discriminator (phase `discriminator_dataset`).
discriminator_dataset_dir = "data/output/datasets/discriminator_dataset"
# Trained decoy discriminator, metrics and predictions (phase `discriminator_train`).
discriminator_model_dir = "data/output/models/discriminator"
# Animated GIFs of the path to the native state (phase `discriminator_score`,
# button Save GIF): folder proposed by the dialog.
animation_dir = "data/output/animations"

[policy_dataset]
# Labelled dataset for the folding policy (phase 2): states of many sequences
# of length protein.length, each with the feasible actions and their distance
# from the native state. See notes/dataset.md.
n_sequences = 100               # sequences in the dataset (lowest energy < 0)
h_fraction = 0.5                # probability that a residue of a random sequence is H
include_config_sequence = true  # protein.sequence is the first sequence
seed = 7                        # sequences, splits, choice of the states
split = [0.8, 0.1, 0.1]         # fractions of train, val, test, by sequence
# Up to this length the oracle works on the graph of all the conformations
# (exact distances); longer chains use the graph of the states visited by the
# REMC (upper bounds). About 800 000 states and 5 s for 16 residues; the
# number grows by about 2.7 times per residue.
exact_max_length = 16
decoys_per_temperature = 20     # REMC snapshots per replica used as starting states
perturb_fraction = 0.25         # recovery states, as a fraction of the path states
perturb_max_moves = 3           # random moves that push a path state off course
max_recorded_steps = 50000      # accepted moves recorded for every walker

[policy_dataset.remc]
# REMC run for every sequence of the dataset, shorter than the one of phase 1.
# The ladder goes to higher temperatures than [remc] so that the snapshots
# also contain unfolded conformations, not only compact ones.
n_replicas = 5
t_min = 0.160
t_max = 1.000
local_steps = 100
n_cycles = 200
rho = 0.4
save_every = 2      # cycles between two snapshots of the replicas
seed = 42           # seed of the first sequence; sequence i uses seed + i

[discriminator_dataset]
# Dataset for the decoy discriminator (phase `discriminator_dataset`): pairs
# (sequence, conformation) labelled native (1) or decoy (0), with their energy.
# Independent of [policy_dataset]; see python/hpfold/discriminator_dataset.py.
n_sequences = 2000              # sequences in the dataset (lowest energy < 0)
length = 16                     # residues of every sequence
h_fraction = 0.5                # probability that a residue of a random sequence is H
seed = 11                       # sequences, splits, choice of the examples
split = [0.8, 0.1, 0.1]         # fractions of train, val, test, by sequence
# Natives per sequence: all the degenerate states at the lowest energy found,
# up to this number. Each sequence gets as many decoys as natives (1:1).
examples_per_class = 20
# Tiers of difficulty of the decoys, by gap from the lowest energy relative to
# |E_min|: near up to tier_edges[0], mid up to tier_edges[1], far above (a gap
# of 1 is always near). The decoys are split evenly among the tiers.
tier_edges = [0.34, 0.67]
trap_fraction = 0.5             # share of the near tier reserved to kinetic traps
trap_search_limit = 200         # near candidates examined to find kinetic traps
# Up to this length the lowest energy of the REMC is checked against exact
# enumeration: sequences whose ground state was not reached are dropped.
exact_check_max_length = 20
max_recorded_steps = 50000      # accepted moves recorded for every walker

[discriminator_dataset.remc]
# REMC run for every sequence of this dataset. Long enough to reach the ground
# state (and its degenerate copies), with hot replicas for far decoys.
n_replicas = 5
t_min = 0.160
t_max = 0.600
local_steps = 100
n_cycles = 500
rho = 0.4
save_every = 2      # cycles between two snapshots of the replicas
seed = 1000         # seed of the first sequence; sequence i uses seed + i

[discriminator_model]
# Decoy discriminator (phase `discriminator_train`), trained on the dataset of
# output.discriminator_dataset_dir: a GNN on the contact graph (conformation)
# and a 1D CNN on the HP string (sequence), with auxiliary heads for energy,
# lowest energy and gap. See notes/discriminator_model.md.
seed = 0                        # initial weights, order of the batches, augmentation
hidden = 64                     # size of the vectors of the residues and of the hidden layers
gnn_layers = 4                  # message-passing layers of the conformation branch
cnn_layers = 4                  # convolutional layers of the sequence branch
cnn_kernel = 5                  # residues seen by one filter (odd)
dropout = 0.1                   # in the MLP heads
# Weights of the MSE of the auxiliary heads, added to the BCE of the label.
# 0 switches a head off (ablation: all 0 = classifier only).
loss_weights = { energy = 0.1, e_min = 0.1, gap = 0.1 }
learning_rate = 1e-3
weight_decay = 1e-4
batch_size = 256
max_epochs = 60
patience = 10                   # epochs without a better val AUROC before stopping
augment_reverse = true          # half of each batch read from the other end of the chain
train_sequences = 0             # train sequences used, chosen at random (0 = all): learning curves
baselines = ["B0a", "B0b", "B1b"]  # simple models trained and evaluated alongside ([] = none)
threads = 0                     # CPU threads used by torch (0 = torch default)
# Conformation judged by the phase `discriminator_score` when the user does not
# draw one in the GUI: a separate TOML file with `sequence` and `coordinates`.
input_conformation = "config/discriminator_input.toml"

# [ml]
# Model and training parameters: to be defined in phase 3.
