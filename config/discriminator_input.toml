# Conformation judged by the decoy discriminator (phase `discriminator_score`)
# when the user chooses not to draw one in the GUI.
#
# The path of this file is discriminator_model.input_conformation in
# config/default.toml. The chain must have as many residues as the sequences
# the model was trained on (discriminator_dataset.length, 16 by default).

# H = hydrophobic, P = polar, in chain order.
sequence = "HHHPPPPHHHHPHHHH"

# Lattice coordinates [x, y] of the residues, in chain order: consecutive
# residues must be adjacent (up/down/left/right) and no cell can be used twice.
# Position and orientation of the chain do not matter.
# This one is a decoy (energy -2, the lowest of the sequence is -7) six moves
# away from the nearest native state, so that the animation that follows the
# judgement has moves to show.
coordinates = [
    [5, 5], [5, 6], [6, 6], [7, 6], [7, 7], [6, 7], [6, 8], [7, 8],
    [8, 8], [8, 9], [7, 9], [7, 10], [8, 10], [9, 10], [9, 11], [10, 11],
]
